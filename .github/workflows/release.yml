name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/refont-$goos-$goarch$ext" .
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
